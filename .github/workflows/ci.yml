name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    env:
      COFFEE_TEN_FUZZ_FAILURE_DIR: ${{ github.workspace }}/target/fuzz-failures
    # macOS minutes are expensive while the repo is private: pull requests run on
    # ubuntu only, pushes to main and manual runs add macOS.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Registry, git sources and build output, per OS, lockfile and toolchain. A miss only
      # costs the first build; a stale target dir is fine because cargo rebuilds what changed.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-${{ github.job }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Links every target, including the Python cdylib, which tests and clippy do not.
      - run: cargo build --workspace --locked
      # Plan item P38: broken links in doc comments fail before merge. Ubuntu only.
      - name: cargo doc --no-deps with -D warnings
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 10
      - run: cargo test --workspace --release --locked
        timeout-minutes: 10

  python:
    env:
      COFFEE_TEN_FUZZ_FAILURE_DIR: ${{ github.workspace }}/target/fuzz-failures
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Registry and git sources only: pip builds the module in its own temporary directory,
      # so ./target is not used here.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-${{ github.job }}-
      - run: python -m pip install ./crates/coffee-ten-py pytest numpy hypothesis
      - run: python -m pytest crates/coffee-ten-py/tests -q
        timeout-minutes: 10
      # Plan item P40: syntax errors in bench/ scripts fail here too, not only in bench-smoke.
      # No coffee-ten-bench is built in this job, so the report/validate.py parity test skips.
      - run: python -m compileall -q bench
      - run: python -m unittest discover -s bench/tests

  # Plan item C15: a short bench/run.sh so the script cannot break unnoticed. The numbers
  # from a shared runner mean nothing; only the shape of the output is checked.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # As in the rust job; run.sh builds coffee-ten-bench in ./target.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ubuntu-latest-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-ubuntu-latest-${{ github.job }}-
      - run: bench/run.sh --quick --sizes 64 --pause 0 --yes
      - name: Check the JSONL it wrote
        run: |
          python3 -m unittest discover -s bench/tests -v
          python3 bench/validate.py bench/results/quick-*.jsonl
          python3 - bench/results/quick-*.jsonl <<'EOF'
          import json, sys
          assert len(sys.argv) == 2, sys.argv
          records = [json.loads(line) for line in open(sys.argv[1])]
          assert len(records) == 9 and records[0]["kind"] == "peak"
          assert all(r["n"] == 64 and r["quick"] is True for r in records[1:])
          EOF
