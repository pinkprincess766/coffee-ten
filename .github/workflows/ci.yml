name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # macOS minutes are expensive while the repo is private: pull requests run on
    # ubuntu only, pushes to main and manual runs add macOS.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Links every target, including the Python cdylib, which tests and clippy do not.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked

  python:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: python -m pip install ./crates/coffee-ten-py pytest numpy hypothesis
      - run: python -m pytest crates/coffee-ten-py/tests -q

  # Plan item C15: a short bench/run.sh so the script cannot break unnoticed. The numbers
  # from a shared runner mean nothing; only the shape of the output is checked.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: bench/run.sh --quick --sizes 64 --pause 0 --yes
      - name: Check the JSONL it wrote
        run: |
          python3 - bench/results/quick-*.jsonl <<'EOF'
          import json, sys
          paths = sys.argv[1:]
          assert len(paths) == 1, paths
          lines = open(paths[0]).read().splitlines()
          records = [json.loads(line) for line in lines]
          # One peak line, then 4 variants for each of 2 kernels at 1 size.
          assert len(records) == 9, len(records)
          assert records[0]["kind"] == "peak", records[0]
          for r in records[1:]:
              assert r["n"] == 64 and r["quick"] is True and r["verified"] is True, r
          print(f"{paths[0]}: {len(records)} valid records")
          EOF
