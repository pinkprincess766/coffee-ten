[workspace]
resolver = "3"
members = ["crates/coffee-ten-ir", "crates/coffee-ten-loop", "crates/coffee-ten-codegen-c", "crates/coffee-ten-interp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
libloading = "0.9"
