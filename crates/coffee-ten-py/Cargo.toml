[package]
name = "coffee-ten-py"
description = "Python bindings for coffee-ten."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "coffee_ten"
crate-type = ["cdylib"]
# No Rust tests: the module is tested from Python (tests/test_api.py), and a test
# binary would need libpython at link time.
test = false
doctest = false

[dependencies]
coffee-ten-ir = { path = "../coffee-ten-ir" }
coffee-ten-interp = { path = "../coffee-ten-interp" }
coffee-ten-loop = { path = "../coffee-ten-loop" }
coffee-ten-codegen-c = { path = "../coffee-ten-codegen-c" }
pyo3 = { workspace = true }
numpy = { workspace = true }
